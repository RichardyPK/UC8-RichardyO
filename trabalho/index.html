<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Configuração obrigatória para funcionar bem em celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Digimons</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🪐Buscador de Digimons</h1>
    </header>
    <section class="area-busca">
        <input
            type="text"
            id="input-busca"
            placeholder="Digite o nome do Digimon"
        >
        <button id="btn-busca">Buscar</button>
    </section>
    <!-- O JavaScript colocará os cards e mensagens aqui -->
    <main id="container-resultado"></main>
    <script src="js/script.js"></script>
</body>
</html>
