<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-central">
        <img src="imagens/image 1.png" alt="GameConnect">
    </div>

    <div class="painel-jogadores">
        <div class="card"><div class="perfil"><img src="imagens/Shape (1).png" alt="Avatar de Joca"><div><h3>Joca</h3><p>Jogador competitivo</p></div></div></div>
        <div class="card"><div class="perfil"><img src="imagens/Shape (2).png" alt="Avatar de Daniele"><div><h3>Daniele</h3><p>FPS Specialist</p></div></div></div>

        <div class="card"><div class="perfil"><img src="imagens/Shape.png" alt="Avatar de Conrado"><div><h3>Conrado</h3><p>Casual Gamer</p></div></div></div>
    </div>

    <div class="botoes">
        <button class="login" onclick="window.location.href='login.html'">Login</button>
        <button class="register" onclick="window.location.href='cadastro.html'">Register</button>
    </div>
