<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GameConnect</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>Login</h1>
            <form>
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="Digite seu e-mail">
                <label for="loginSenha">Senha</label>
                <input type="password" id="loginSenha" placeholder="Senha">
                <div class="opcoes">
                    <label class="lembrar"><input type="checkbox"> Lembrar de mim</label>
                </div>
                <button type="button" onclick="login()">Entrar</button>
                <p class="cadastro-link">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            </form>
        </div>
    </div>
    <script src="Js/script.js"></script>
</body>
</html>
